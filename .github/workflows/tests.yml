name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Headless · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.x']
    env:
      FOLLOWSPOT_TEST_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDL2 on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
      - name: Install pinned SDL2 runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'SDL2.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'SDL2'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10-win32-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6cf9706eefd0a4a06dc764007934d428afaf029fabdd408a9e646048c91e18fb') {
            throw 'SDL2 archive checksum does not match the official release.'
          }
          Expand-Archive $archive -DestinationPath $destination
          $library = Get-ChildItem $destination -Recurse -Filter SDL2.dll | Select-Object -First 1
          if (-not $library) { throw 'SDL2.dll was not found in the release archive.' }
          "FOLLOWSPOT_SDL2=$($library.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run tests (GUI skips reported explicitly)
        run: python -m unittest discover -s tests -v
      - name: Validate example settings
        run: python followspot.py --settings settings.example.json --check-settings
      - name: Check whitespace
        run: git show --format= --check HEAD

  macos:
    name: macOS Tk and native input · Python ${{ matrix.python }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.x']
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDL2
        run: brew install sdl2
      - name: Probe Tk in a subprocess
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          probe = subprocess.run(
              [sys.executable, '-c', 'import tkinter as tk; root = tk.Tk(); root.destroy()'],
              capture_output=True, text=True, timeout=20)
          if probe.returncode:
              print('::warning::Tk window unavailable; GUI tests will be explicitly skipped. Native/backend tests still run.')
              print(probe.stderr.strip())
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                  output.write('FOLLOWSPOT_TEST_HEADLESS=1\n')
          else:
              print('Tk window available: running the real-window tests.')
          PY
      - name: Run tests (including available Tk/native checks)
        run: python -m unittest discover -s tests -v
      - name: Validate example settings
        run: python followspot.py --settings settings.example.json --check-settings
      - name: Check launcher syntax
        run: zsh -n 'Launch Followspot.command'
      - name: Check whitespace
        run: git show --format= --check HEAD
